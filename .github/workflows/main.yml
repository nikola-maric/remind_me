name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        ruby: ["2.3.7", "2.4.10", "2.5.9", "2.6.8", "2.7.8", "3.0.7", "3.1.7", "3.2.10", "3.3.10", "3.4.8", "4.0.1", "jruby-9.2", "jruby-9.3", "jruby-9.4", "jruby-10.0"]
        exclude:
          # Old MRI Ruby (2.3–2.6) — ubuntu-latest only (no ARM/macOS prebuilt binaries)
          - { os: ubuntu-24.04-arm, ruby: "2.3.7" }
          - { os: ubuntu-24.04-arm, ruby: "2.4.10" }
          - { os: ubuntu-24.04-arm, ruby: "2.5.9" }
          - { os: ubuntu-24.04-arm, ruby: "2.6.8" }
          - { os: macos-14, ruby: "2.3.7" }
          - { os: macos-14, ruby: "2.4.10" }
          - { os: macos-14, ruby: "2.5.9" }
          - { os: macos-14, ruby: "2.6.8" }
          # Old JRuby (9.2, 9.3) — ubuntu-latest only
          - { os: ubuntu-24.04-arm, ruby: "jruby-9.2" }
          - { os: ubuntu-24.04-arm, ruby: "jruby-9.3" }
          - { os: macos-14, ruby: "jruby-9.2" }
          - { os: macos-14, ruby: "jruby-9.3" }
        include:
          - ruby: "2.3.7"
            requires-older-rubygems: true
            requires-older-bundler: true
            os: ubuntu-latest
          - ruby: "2.4.10"
            requires-older-rubygems: true
            requires-older-bundler: true
            os: ubuntu-latest
          - ruby: "jruby-9.2"
            requires-older-bundler: true
            os: ubuntu-latest
          - ruby: "jruby-9.3"
            requires-older-bundler: true
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - if: ${{ matrix.requires-older-rubygems }}
      run: gem update --system 3.2.3
    - if: ${{ matrix.requires-older-bundler }}
      run: gem install bundler -v 2.3.26
    - name: Bundle install
      run: bundle install --jobs=3
    - name: Run tests (MRI)
      run: bundle exec rake spec
      if: "!startsWith(matrix.ruby, 'jruby')"
    - name: Run tests (JRuby)
      run: JRUBY_OPTS=--debug bundle exec rake spec
      if: startsWith(matrix.ruby, 'jruby')

  build-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        ruby: ["2.7.8", "3.0.7", "3.1.7", "3.2.10", "3.3.10", "3.4.8", "4.0.1"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Bundle install
      run: bundle install --jobs=3
    - name: Compile native extension
      run: bundle exec rake compile
    - name: Run tests
      run: bundle exec rake spec
